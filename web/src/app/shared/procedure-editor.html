<form
  [class]="variant() === 'page' ? 'card bg-base-100 shadow' : ''"
  [formGroup]="form"
  (ngSubmit)="submit()"
>
  <div [class.card-body]="variant() === 'page'" [class.space-y-4]="variant() === 'page'">
    <div
      class="bg-secondary px-4 py-3 text-secondary-content"
      [class.rounded-box]="variant() === 'page'"
      [class.rounded-t-box]="variant() === 'modal'"
    >
      <div class="flex items-start justify-between gap-3">
        <div>
          <h2 class="text-2xl font-bold">{{ isEdit() ? 'Editar trámite' : 'Nuevo trámite' }}</h2>
          <p class="opacity-90">Puede ser de una sola vez o repetirse cada mes, semestre o año.</p>
        </div>
        @if (variant() === 'modal') {
          <button class="btn btn-ghost btn-sm btn-circle text-secondary-content" type="button" (click)="cancelled.emit()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        }
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4 md:grid-cols-2" [class.p-6]="variant() === 'modal'">
      @if (!lockVehicle()) {
        <div class="field md:col-span-2">
          <span class="field-label">Vehículo</span>
          <select class="select select-bordered" formControlName="vehicleId">
            <option value="">Selecciona un vehículo</option>
            @for (vehicle of vehicles(); track vehicle.id) {
              <option [value]="vehicle.id">{{ vehicle.brand }} {{ vehicle.model }} · {{ vehicle.licensePlate }}</option>
            }
          </select>
        </div>
      }

      <div class="field md:col-span-2">
        <span class="field-label">Título</span>
        <input class="input input-bordered" formControlName="title" placeholder="Verificación, tenencia, seguro..." />
      </div>
      <div class="field">
        <span class="field-label">Periodicidad</span>
        <select class="select select-bordered" formControlName="frequency">
          <option value="Once">Una sola vez</option>
          <option value="Monthly">Mensual</option>
          <option value="Semiannual">Semestral</option>
          <option value="Annual">Anual</option>
        </select>
      </div>
      <div class="field">
        <span class="field-label">Fecha de vencimiento</span>
        <input class="input input-bordered" type="date" formControlName="dueDate" />
      </div>
      <div class="field md:col-span-2">
        <span class="field-label">Descripción</span>
        <textarea class="textarea textarea-bordered" rows="3" formControlName="description"></textarea>
      </div>

      @if (error()) {
        <div class="alert alert-error md:col-span-2">{{ error() }}</div>
      }

      <div class="flex justify-end gap-2 md:col-span-2">
        <button class="btn btn-ghost" type="button" (click)="cancelled.emit()">Cancelar</button>
        <button class="btn btn-primary" type="submit" [disabled]="loading()">
          @if (loading()) {
            <span class="loading loading-spinner"></span>
          }
          Guardar
        </button>
      </div>
    </div>
  </div>
</form>
