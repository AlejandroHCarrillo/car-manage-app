<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="bg-secondary px-4 py-3 text-secondary-content rounded-t-box">
    <div class="flex items-start justify-between gap-3">
      <div>
        <h2 class="text-2xl font-bold">Subir documento</h2>
        <p class="opacity-90">Póliza, tenencia, factura u otro archivo del vehículo.</p>
      </div>
      <button class="btn btn-ghost btn-sm btn-circle text-secondary-content" type="button" (click)="cancelled.emit()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-4 p-6 md:grid-cols-2">
    <div class="field md:col-span-2">
      <span class="field-label">Tipo</span>
      <select class="select select-bordered" formControlName="kind">
        @for (kind of kinds; track kind) {
          <option [value]="kind">{{ vehiclesApi.documentKindLabel(kind) }}</option>
        }
      </select>
    </div>
    <div class="field md:col-span-2">
      <span class="field-label">Título</span>
      <input class="input input-bordered" formControlName="title" placeholder="Póliza Qualitas 2026, tenencia CDMX..." />
    </div>
    <div class="field">
      <span class="field-label">Fecha de emisión</span>
      <input class="input input-bordered" type="date" formControlName="issuedOn" />
    </div>
    <div class="field">
      <span class="field-label">Vigencia / vencimiento</span>
      <input class="input input-bordered" type="date" formControlName="expiresOn" />
    </div>
    <div class="field md:col-span-2">
      <span class="field-label">Archivo</span>
      <input
        class="file-input file-input-bordered w-full"
        type="file"
        accept="application/pdf,image/jpeg,image/png,image/webp"
        (change)="onFileSelected($event)"
      />
      <p class="text-xs opacity-70">PDF, JPG, PNG o WEBP. Máximo 10 MB. {{ fileName() || 'Sin archivo seleccionado.' }}</p>
    </div>
    <div class="field md:col-span-2">
      <span class="field-label">Notas</span>
      <textarea class="textarea textarea-bordered" rows="3" formControlName="notes"></textarea>
    </div>

    @if (error()) {
      <div class="alert alert-error md:col-span-2">{{ error() }}</div>
    }

    <div class="flex justify-end gap-2 md:col-span-2">
      <button class="btn btn-ghost" type="button" (click)="cancelled.emit()">Cancelar</button>
      <button class="btn btn-primary" type="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="loading loading-spinner"></span>
        }
        Subir
      </button>
    </div>
  </div>
</form>
